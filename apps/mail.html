<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>البريد</title>
    <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        html, body { 
            font-family: -apple-system, 'IBM Plex Sans Arabic', sans-serif; 
            height: 100%; 
            background: #000; 
            color: white; 
            overflow: hidden; 
        }
        .mail-app { display: flex; flex-direction: column; height: 100%; }
        
        .header { 
            padding: 45px 20px 10px; 
            display: flex; 
            justify-content: space-between; 
            align-items: center; 
            background: #1c1c1e; 
            border-bottom: 0.5px solid #2c2c2e;
        }
        .header h1 { font-size: 30px; font-weight: 700; }
        .header-btn { background: none; border: none; color: #0a84ff; font-size: 16px; cursor: pointer; font-family: inherit; }
        
        .filter-bar { display: flex; gap: 8px; padding: 10px 15px; background: #1c1c1e; }
        .filter-btn { padding: 6px 14px; background: #2c2c2e; border: none; border-radius: 15px; color: #8e8e93; font-size: 13px; cursor: pointer; font-family: inherit; }
        .filter-btn.active { background: #0a84ff; color: white; font-weight: 500; }
        
        .mail-list { flex: 1; overflow-y: auto; background: #000; }
        .mail-item { display: flex; gap: 12px; padding: 12px 15px; border-bottom: 0.5px solid #1c1c1e; cursor: pointer; align-items: flex-start; }
        .mail-item:active { background: #1c1c1e; }
        
        .mail-indicator { width: 9px; height: 9px; background: #0a84ff; border-radius: 50%; flex-shrink: 0; margin-top: 8px; }
        .mail-indicator.read { background: transparent; }
        
        .mail-content { flex: 1; min-width: 0; }
        .mail-header { display: flex; justify-content: space-between; margin-bottom: 2px; align-items: center; }
        .mail-sender { font-size: 16px; font-weight: 600; color: #fff; }
        .mail-sender.read { font-weight: 400; color: #8e8e93; }
        .mail-time { font-size: 13px; color: #8e8e93; }
        
        .mail-subject { font-size: 15px; margin-bottom: 2px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; color: #fff; font-weight: 500; }
        .mail-subject.read { color: #8e8e93; font-weight: 400; }
        
        .mail-preview { font-size: 14px; color: #8e8e93; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .mail-arrow { color: #8e8e93; align-self: center; font-size: 18px; }
        
        .compose-btn { 
            position: fixed; bottom: 30px; left: 20px; 
            width: 54px; height: 54px; border-radius: 50%; 
            background: #0a84ff; border: none; color: white; 
            font-size: 24px; cursor: pointer; 
            box-shadow: 0 4px 15px rgba(10,132,255,0.4); 
            display: flex; align-items: center; justify-content: center;
        }

        /* Mail View Details */
        .mail-view { position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: #000; display: none; flex-direction: column; z-index: 100; }
        .mail-view.active { display: flex; }
        .mail-view-header { display: flex; align-items: center; gap: 10px; padding: 45px 15px 12px; background: #1c1c1e; border-bottom: 0.5px solid #2c2c2e; }
        .btn-back { background: none; border: none; color: #0a84ff; font-size: 30px; cursor: pointer; line-height: 1; }
        
        .mail-view-content { flex: 1; overflow-y: auto; padding: 20px; }
        .mail-view-subject { font-size: 20px; font-weight: 700; margin-bottom: 15px; color: #fff; line-height: 1.3; }
        .mail-view-meta { display: flex; gap: 12px; margin-bottom: 20px; align-items: center; border-bottom: 0.5px solid #2c2c2e; padding-bottom: 15px; }
        
        .sender-avatar { width: 42px; height: 42px; border-radius: 50%; background: #2c2c2e; display: flex; align-items: center; justify-content: center; font-size: 18px; flex-shrink: 0; }
        .sender-info { flex: 1; min-width: 0; }
        .sender-name { font-size: 15px; font-weight: 600; color: #fff; }
        .sender-email { font-size: 12px; color: #8e8e93; }
        .mail-body { font-size: 15px; line-height: 1.7; color: #e5e5ea; white-space: pre-line; }
    </style>
</head>
<body>
    <div class="mail-app">
        <div class="header">
            <button class="header-btn">المجلدات</button>
            <h1>البريد الوارد</h1>
            <button class="header-btn">تحديد</button>
        </div>
        <div class="filter-bar">
            <button class="filter-btn active">الكل</button>
            <button class="filter-btn">غير مقروء</button>
            <button class="filter-btn">المهمة</button>
        </div>
        <div class="mail-list" id="mail-list"></div>
        <button class="compose-btn">✏️</button>

        <!-- Mail View -->
        <div class="mail-view" id="mail-view">
            <div class="mail-view-header">
                <button class="btn-back" id="btn-back">‹</button>
                <span style="flex:1"></span>
                <button class="header-btn">🗑</button>
                <button class="header-btn">↩️</button>
            </div>
            <div class="mail-view-content">
                <div class="mail-view-subject" id="view-subject">الموضوع</div>
                <div class="mail-view-meta">
                    <div class="sender-avatar" id="view-avatar">🏢</div>
                    <div class="sender-info">
                        <div class="sender-name" id="view-sender">المرسل</div>
                        <div class="sender-email" id="view-email">email@example.com</div>
                    </div>
                </div>
                <div class="mail-body" id="view-body">محتوى البريد...</div>
            </div>
        </div>
    </div>

    <script>
        const emails = [
            { 
                id: 1, 
                sender: 'شركة الحراسات الأمنية', 
                email: 'hr@guard-shield.sa', 
                avatar: '🛡️', 
                subject: 'عرض عمل: وظيفة حارس أمن (بشفتات ليلية)', 
                preview: 'عزيزي المتقدم، نود إفادتك بقبولك المبدئي لوظيفة حارس أمن...', 
                time: '١٠:٣٠ ص', 
                read: false, 
                body: 'عزيزي المتقدم عبدالله،\n\nبالإشارة إلى طلبك المقدم عبر منصات التوظيف (مع العلم أننا لاحظت أن تخصصك نظم معلومات)، نود إفادتك بأنه تم قبولك مبدئياً لشغل وظيفة "حارس أمن" في أحد المشاريع بمعدل 12 ساعة عمل يومياً وبدون إجازة أسبوعية ثابتة.\n\nالراتب الاجمالي : 1500 ريال.\n\nيرجى سرعة مراجعة الفرع الرئيسي لإحضار الأوراق الثبوتية وبدء العمل مباشرة.\n\nمع تحيات,\nقسم الموارد البشرية' 
            },
            { 
                id: 2, 
                sender: 'شؤون الموظفين - شركة مقاولات الديناصورات المتحدة', 
                email: 'careers@aldinasor-contracting.com', 
                avatar: '🏗️', 
                subject: 'نتيجة التقديم على وظيفة IT Specialist', 
                preview: 'نعتذر عن عدم قبولك لعدم تطابق الشروط والمطلوب خبرة...', 
                time: '٩:١٥ ص', 
                read: false, 
                body: 'عزيزي المتقدم،\n\nنشكر لك اهتمامك بالانضمام إلى شركة مقاولات الديناصورات المتحدة وإرسال سيرتك الذاتية في تخصص نظم وتقنية المعلومات.\n\nبعد دراسة طلبك من قبل لجنة التوظيف، نأسف لإبلاغك بأنه تم اختيار مرشحين آخرين تتطابق خبراتهم السابقة بشكل أكبر مع احتياجات المشروع الحالية.\n\nنتمنى لك التوفيق في مسيرتك المهنية.\n\nإدارة التوظيف' 
            },
            { 
                id: 3, name: 'منصة', 
                sender: 'إدارة التوظيف الحكومي', 
                email: 'noreply@jadarah.gov.sa', 
                avatar: '🏛️', 
                subject: 'حالة الطلب: نعتذر لعدم اجتياز المفاضلة', 
                preview: 'عزيزي المواطن، نود إفادتك بأنه لم يتم ترشيحك في الوظائف...', 
                time: 'أمس', 
                read: true, 
                body: 'عزيزي المتقدم،\n\nبخصوص طلبك على الوظائف الإدارية والتقنية المطروحة عبر المفاضلة الأخيرة، نود إفادتك بأنه بعد اكتمال عمليات التدقيق والمطابقة لم يتم ترشيح رقم طلبك لعدم وصول نقاط المفاضلة للحد المطلوب.\n\nشكراً لاستخدامكم قنوات التوظيف الحكومية.' 
            },
            { 
                id: 4, 
                sender: 'تابي- Tabby', 
                email: 'notifications@tabby.com', 
                avatar: '💳', 
                subject: 'تذكير بسداد القسط المستحق', 
                preview: 'عزيزي العميل، نود تذكيركم بوجوب سداد القسط الشهري...', 
                time: 'أول أمس', 
                read: true, 
                body: 'عزيزي العميل،\n\nنود تذكيركم بأن موعد سداد القسط الشهري بقيمة 1000 ريال هو بتاريخ اليوم.\n\nيرجى التأكد من توفر الرصيد الكافي في الحساب لتجنب أي رسوم تأخير إضافية.\n\nخدمة العملاء' 
            },
            { 
                id: 5, 
                sender: 'تقنية المعلومات - البوابة الموحدة', 
                email: 'it-support@tech-portal.sa', 
                avatar: '💻', 
                subject: 'تم استلام سيرتك الذاتية بنجاح', 
                preview: 'شكراً لتقديمك على وظيفة محلل نظم، سيتم مراجعة الطلب...', 
                time: '١٩ ديسمبر', 
                read: true, 
                body: 'عزيزي الباحث عن العمل،\n\nتأكيداً لاستلامنا لطلبكم الخاص بوظيفة (محلل نظم وتطبيقات)، نشعركم بأنه تم حفظ سيرتكم الذاتية في قاعدة البيانات الخاصة بنا.\n\nسنقوم بالاتصال بكم في حال توفرت شاغرة مناسبة لمؤهلاتكم.\n\nمع أطيب التحيات.' 
            }
        ];

        const list = document.getElementById('mail-list');
        
        function renderEmails() {
            list.innerHTML = emails.map(e => `
                <div class="mail-item" data-id="${e.id}">
                    <div class="mail-indicator ${e.read ? 'read' : ''}"></div>
                    <div class="mail-content">
                        <div class="mail-header">
                            <span class="mail-sender ${e.read ? 'read' : ''}">${e.sender}</span>
                            <span class="mail-time">${e.time}</span>
                        </div>
                        <div class="mail-subject ${e.read ? 'read' : ''}">${e.subject}</div>
                        <div class="mail-preview">${e.preview}</div>
                    </div>
                    <span class="mail-arrow">›</span>
                </div>
            `).join('');
            
            attachEvents();
        }

        const mailView = document.getElementById('mail-view');
        
        function attachEvents() {
            document.querySelectorAll('.mail-item').forEach(item => {
                item.addEventListener('click', () => {
                    const email = emails.find(e => e.id == item.dataset.id);
                    email.read = true; // جعل الإيميل مقروءاً عند فتحه
                    
                    document.getElementById('view-subject').textContent = email.subject;
                    document.getElementById('view-sender').textContent = email.sender;
                    document.getElementById('view-email').textContent = email.email;
                    document.getElementById('view-avatar').textContent = email.avatar;
                    document.getElementById('view-body').textContent = email.body;
                    
                    mailView.classList.add('active');
                    renderEmails(); // تحديث القائمة لإزالة نقطة عدم القراءة
                });
            });
        }

        document.getElementById('btn-back').addEventListener('click', () => mailView.classList.remove('active'));
        
        document.querySelectorAll('.filter-btn').forEach(btn => {
            btn.addEventListener('click', () => {
                document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
                btn.classList.add('active');
            });
        });

        renderEmails();
    </script>
</body>
</html>
