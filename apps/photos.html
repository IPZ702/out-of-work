<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>الصور</title>
    <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@300;400;500;600&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        
        html, body {
            font-family: -apple-system, 'IBM Plex Sans Arabic', sans-serif;
            height: 100%;
            background: #000;
            color: white;
            overflow: hidden;
        }

        .photos-app {
            display: flex;
            flex-direction: column;
            height: 100%;
        }

        .header {
            padding: 45px 20px 12px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: rgba(28, 28, 30, 0.8);
            backdrop-filter: blur(20px);
            border-bottom: 0.5px solid rgba(255,255,255,0.1);
        }

        .header h1 { font-size: 20px; font-weight: 700; }

        .header-btn {
            background: none;
            border: none;
            color: #007aff;
            font-size: 16px;
            cursor: pointer;
            font-family: inherit;
        }

        .content {
            flex: 1;
            overflow-y: auto;
            padding-bottom: 90px;
        }

        /* Photo Grid */
        .photo-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 2px;
        }

        .photo-item {
            aspect-ratio: 1;
            cursor: pointer;
            position: relative;
            overflow: hidden;
            background: #1c1c1e;
        }

        .photo-item img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
        }

        /* Months */
        .month-header {
            padding: 18px 15px 10px;
            font-size: 20px;
            font-weight: 700;
        }

        /* Tab Bar */
        .tab-bar {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            display: flex;
            justify-content: space-around;
            padding: 10px 0 25px;
            background: rgba(28, 28, 30, 0.9);
            backdrop-filter: blur(25px);
            border-top: 0.5px solid rgba(255,255,255,0.15);
        }

        .tab-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 4px;
            background: none;
            border: none;
            color: #8e8e93;
            font-size: 10px;
            cursor: pointer;
            font-family: inherit;
        }

        .tab-item.active { color: #007aff; }
        .tab-icon { font-size: 20px; }

        /* Viewer */
        .photo-viewer {
            position: absolute;
            inset: 0;
            background: #000;
            display: none;
            flex-direction: column;
            z-index: 100;
        }

        .photo-viewer.active { display: flex; }

        .viewer-header {
            display: flex;
            justify-content: space-between;
            padding: 45px 20px 15px;
            background: rgba(0,0,0,0.5);
        }

        .btn-close, .btn-edit {
            background: none;
            border: none;
            color: #007aff;
            font-size: 16px;
            cursor: pointer;
            font-family: inherit;
        }

        .viewer-content {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
        }

        .viewer-content img {
            max-width: 100%;
            max-height: 100%;
            object-fit: contain;
        }

        .viewer-footer {
            display: flex;
            justify-content: space-around;
            padding: 20px 20px 35px;
            background: rgba(0,0,0,0.5);
            border-top: 0.5px solid rgba(255,255,255,0.1);
        }

        .action-btn {
            background: none;
            border: none;
            color: #007aff;
            font-size: 24px;
            cursor: pointer;
        }
    </style>
</head>
<body>
    <div class="photos-app">
        <div class="header">
            <button class="header-btn">تحديد</button>
            <h1>الصور</h1>
            <button class="header-btn">⋯</button>
        </div>

        <div class="content">
            <div class="month-header">ديسمبر ٢٠٢٤</div>
            <div class="photo-grid" id="photo-grid"></div>

            <div class="month-header">نوفمبر ٢٠٢٤</div>
            <div class="photo-grid" id="photo-grid-2"></div>
        </div>

        <div class="tab-bar">
            <button class="tab-item active">
                <span class="tab-icon">🖼</span>
                <span>المكتبة</span>
            </button>
            <button class="tab-item">
                <span class="tab-icon">📅</span>
                <span>لك</span>
            </button>
            <button class="tab-item">
                <span class="tab-icon">📁</span>
                <span>الألبومات</span>
            </button>
            <button class="tab-item">
                <span class="tab-icon">🔍</span>
                <span>بحث</span>
            </button>
        </div>

        <!-- Photo Viewer -->
        <div class="photo-viewer" id="photo-viewer">
            <div class="viewer-header">
                <button class="btn-close" id="btn-close">✕</button>
                <button class="btn-edit">تعديل</button>
            </div>
            <div class="viewer-content">
                <img id="viewer-photo" src="" alt="صورة مكبرة">
            </div>
            <div class="viewer-footer">
                <button class="action-btn">📤</button>
                <button class="action-btn">❤️</button>
                <button class="action-btn">🗑</button>
            </div>
        </div>
    </div>

    <script>
        // ضع هنا روابط الصور المباشرة (URLs) أو مسارات الصور في مشروعك
        const photos = [
    { url: 'https://lh3.googleusercontent.com/d/1a76uuvkqqMTltI9cyQ8f0J99fufEOCh9' },
            { url: 'https://images.unsplash.com/photo-1519681393784-d120267933ba?w=400' },
            { url: 'https://images.unsplash.com/photo-1470071459604-3b5ec3a7fe05?w=400' },
            { url: 'https://images.unsplash.com/photo-1506744038136-46273834b3fb?w=400' },
            { url: 'https://images.unsplash.com/photo-1510798831971-661eb04b3739?w=400' },
            { url: 'https://images.unsplash.com/photo-1534447677768-be436bb09401?w=400' }
        ];

        

        function renderPhotos(container, photoArray) {
            container.innerHTML = photoArray.map((photo, i) => `
                <div class="photo-item" data-url="${photo.url}">
                    <img src="${photo.url}" alt="صورة" loading="lazy">
                </div>
            `).join('');
        }

        renderPhotos(document.getElementById('photo-grid'), photos);
        renderPhotos(document.getElementById('photo-grid-2'), photos2);

        // Photo viewer
        const viewer = document.getElementById('photo-viewer');
        const viewerPhoto = document.getElementById('viewer-photo');

        document.querySelectorAll('.photo-item').forEach(item => {
            item.addEventListener('click', () => {
                const url = item.getAttribute('data-url');
                viewerPhoto.src = url;
                viewer.classList.add('active');
            });
        });

        document.getElementById('btn-close').addEventListener('click', () => {
            viewer.classList.remove('active');
        });
    </script>
</body>
</html>
